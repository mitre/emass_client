  /api/system-roles/{roleCategory}:
    get:
      description: Returns the role(s) data matching parameters.
      operationId: getSystemRolesByCategoryId
      parameters:
      - description: "**Role Category**: The system role category been queried"
        explode: false
        in: path
        name: roleCategory
        required: true
        schema:
          default: PAC
          enum:
          - CAC
          - PAC
          - Other
          type: string
        style: simple
      - description: "**Role**: Accepts single value from options available at base\
          \ system-roles endpoint e.g., SCA."
        explode: true
        in: query
        name: role
        required: true
        schema:
          default: IAO
          type: string
        style: form
      - description: |-
          **System Policy**: Filter query by system policy.
          If no value is specified, the default returns RMF policy information for dual-policy systems.
        explode: true
        in: query
        name: policy
        required: false
        schema:
          default: rmf
          enum:
          - diacap
          - rmf
          - reporting
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRolesCategoryResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Not_Found"
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Method_Not_Allowed"
          description: Method Not Allowed
        "490":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/API_Rule_Failed"
          description: API Rule Failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internal_Server_Error"
          description: Internal Server Error
      summary: Get system roles
      tags:
      - System Roles
  /api/systems/{systemId}/controls:
    get:
      description: Returns system control information for matching `systemId` path
        parameter
      operationId: getSystemControls
      parameters:
      - description: "**System Id**: The unique system record identifier."
        explode: false
        in: path
        name: systemId
        required: true
        schema:
          example: 35
          type: integer
          x-faker: random.number
        style: simple
      - description: "**Acronym**: The system acronym(s) being queried (single value\
          \ or comma delimited values)."
        explode: true
        in: query
        name: acronyms
        required: false
        schema:
          default: PM-6
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlsResponseGet"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Not_Found"
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Method_Not_Allowed"
          description: Method Not Allowed
        "490":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/API_Rule_Failed"
          description: API Rule Failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internal_Server_Error"
          description: Internal Server Error
      summary: Get control information in a system for one or many controls
      tags:
      - Controls
    put:
      description: |-
        Update a Control for given `systemId`<br>

        **Request Body Required Fields**
        - `acronym`
        - `responsibleEntities`
        - `controlDesignation`
        - `estimatedCompletionDate`
        - `implementationNarrative`

        <br>
        **Business Rules**

        The following **optional fields** (plus the **Request Body Required Fields**) are required based on the Implementation Status (`implementationStatus`) field value:<br>

        <table>
          <thead>
            <tr><th><b>Status</b></th><th><b>Required Fields</b></th></tr>
          </thead>
          <tbody>
            <tr><td><b>Planned</b> or <b>Implemented</b></td><td><code>slcmCriticality, slcmFrequency, slcmMethod, slcmReporting, slcmTracking, slcmComments</code></td></tr>
            <tr><td><b>Not Applicable</b></td><td><code>naJustification</code></td></tr>
            <tr><td><b>Manually Inherited</b></td><td><code>commonControlProvider, slcmCriticality, slcmFrequency, slcmMethod, slcmReporting, slcmTracking, slcmComments</code></td></tr>
          </tbody>
        </table>


        **NOTES:**
        - Risk Assessment information cannot be updated if a Security Control is `Inherited`.
        - Risk Assessment information cannot be updated for a DIACAP system record.
        - Implementation Plan information cannot be saved if the these fields exceed 2,000 character limits:
          - `naJustification`,`responsibleEntities`,`implementationNarrative`,`slcmCriticality`
          - `slcmFrequency`,`slcmMethod`,`slcmReporting`,`slcmTracking`,`slcmComments`
        - Implementation Plan or Risk Assessment information cannot be updated if Security Control does not exist in the system record.
      operationId: updateControlBySystemId
      parameters:
      - description: "**System Id**: The unique system record identifier."
        explode: false
        in: path
        name: systemId
        required: true
        schema:
          example: 35
          type: integer
          x-faker: random.number
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlsRequestPutBody"
        description: Example request body for updating an existing control for a given
          system.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlsResponsePut"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Not_Found"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internal_Server_Error"
          description: Internal Server Error
      summary: Update control information in a system for one or many controls
      tags:
      - Controls
  /api/systems/{systemId}/test-results:
    get:
      description: Returns system test results information for matching parameters.<br>
      operationId: getSystemTestResults
      parameters:
      - description: "**System Id**: The unique system record identifier."
        explode: false
        in: path
        name: systemId
        required: true
        schema:
          example: 35
          type: integer
          x-faker: random.number
        style: simple
      - description: "**Control Acronym**: Filter query by given system acronym (single\
          \ value or comma separated)."
        explode: true
        in: query
        name: controlAcronyms
        required: false
        schema:
          type: string
        style: form
      - description: "**Assessment Procedure**: Filter query by given Security Control\
          \ Assessment Procedure (single value or comma separated)."
        explode: true
        in: query
        name: assessmentProcedures
        required: false
        schema:
          type: string
        style: form
      - description: "**CCI System**: Filter query by Control Correlation Identifiers\
          \ (CCIs) (single value or comma separated)."
        explode: true
        in: query
        name: ccis
        required: false
        schema:
          type: string
        style: form
      - description: "**Latest Results Only**: Indicates that only the latest test\
          \ resultes are retrieved."
        explode: true
        in: query
        name: latestOnly
        required: false
        schema:
          default: true
          type: boolean
          x-faker: random.boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestResultsResponseGet"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Not_Found"
          description: Not Found
        "405":
          content:
            application/json:
              schema:
