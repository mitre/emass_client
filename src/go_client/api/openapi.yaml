      description: Tests the endpoint connection
      operationId: testConnection
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Method_Not_Allowed"
          description: Method Not Allowed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internal_Server_Error"
          description: Internal Server Error
      summary: Test connection to the API
      tags:
      - Test
  /api/api-key:
    post:
      description: Returns the API Key (api-key) that must be provided in the request
        header for all endpoint calls.
      operationId: registerUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Register"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Not_Found"
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Method_Not_Allowed"
          description: Method Not Allowed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internal_Server_Error"
          description: Internal Server Error
      summary: Register user certificate and obtain an API key
      tags:
      - Registration
  /api/systems:
    get:
      description: Returns all system(s) that match the query parameters
      operationId: getSystems
      parameters:
      - description: "**COAMS ID**: Filter query by Cyber Operational Attributes Management\
          \ System (COAMS)."
        explode: true
        in: query
        name: coamsId
        required: false
        schema:
          type: string
        style: form
      - description: "**DITPR ID**: Filter query by DoD Information Technology (IT)\
          \ Portfolio Repository (DITPR)."
        explode: true
        in: query
        name: ditprId
        required: false
        schema:
          type: string
        style: form
      - description: |-
          **Include Decommissioned Systems**: Indicates if decommissioned systems are retrieved.
          If no value is specified, the default returns true to include decommissioned systems.
        explode: true
        in: query
        name: includeDecommissioned
        required: false
        schema:
          default: true
          type: boolean
          x-faker: random.boolean
        style: form
      - description: |-
          **Include DITPR**: Indicates if DITPR metrics are retrieved.
          This query string parameter cannot be used in conjunction with the following parameters:
            - ditprId
            - coamsId

          If no value is specified, the default returns false to not include DITPR Metrics.
        explode: true
        in: query
        name: includeDitprMetrics
        required: false
        schema:
          default: false
          type: boolean
          x-faker: random.boolean
        style: form
      - description: |-
          **System Policy**: Filter query by system policy.
          If no value is specified, the default returns RMF policy information for dual-policy systems.
        explode: true
        in: query
        name: policy
        required: false
        schema:
          default: rmf
          enum:
          - diacap
          - rmf
          - reporting
          type: string
        style: form
      - description: |
          **Registration Type**: Filter record by selected registration type (single value or comma delimited values).

          **Valid Options Are:** assessAndAuthorize, assessOnly, guest, regular,
          functional, cloudServiceProvider, commonControlProvider, authorizationToUse,
          reciprocityAcceptanc
        explode: true
        in: query
        name: registrationType
        required: false
        schema:
          default: regular
          type: string
        style: form
      - description: "**DoD Cyber Hygiene Scorecard**: Used to filter results to only\
          \ return systems that report to the DoD Cyber Hygiene Scorecard."
        explode: true
        in: query
        name: reportsForScorecard
        required: false
        schema:
          default: true
          type: boolean
          x-faker: random.boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemsResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Not_Found"
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Method_Not_Allowed"
          description: Method Not Allowed
        "490":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/API_Rule_Failed"
          description: API Rule Failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internal_Server_Error"
          description: Internal Server Error
      summary: Get system information
      tags:
      - Systems
  /api/systems/{systemId}:
    get:
      description: Returns the system matching provided parameters
      operationId: getSystem
      parameters:
      - description: "**System Id**: The unique system record identifier."
        explode: false
        in: path
        name: systemId
        required: true
        schema:
          example: 35
          type: integer
          x-faker: random.number
        style: simple
      - description: |-
          **System Policy**: Filter query by system policy.
          If no value is specified, the default returns RMF policy information for dual-policy systems.
        explode: true
        in: query
        name: policy
        required: false
        schema:
          default: rmf
          enum:
          - diacap
          - rmf
          - reporting
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Not_Found"
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Method_Not_Allowed"
          description: Method Not Allowed
        "490":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/API_Rule_Failed"
          description: API Rule Failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internal_Server_Error"
          description: Internal Server Error
      summary: Get system information for a specific system
      tags:
      - Systems
  /api/system-roles:
    get:
      description: Returns all available roles
      operationId: getSystemRoles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRolesResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Not_Found"
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Method_Not_Allowed"
          description: Method Not Allowed
        "490":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/API_Rule_Failed"
          description: API Rule Failed
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internal_Server_Error"
          description: Internal Server Error
