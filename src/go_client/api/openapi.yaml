    CloudResourcesRequestPostBody:
      additionalProperties: false
      items:
        properties:
          provider:
            description: "[Required] Cloud service provider name"
            example: azure
            type: string
          resourceId:
            description: "[Required] Unique identifier/resource namespace for policy\
              \ compliance result"
            example: /subscriptions/123456789/sample/resource/namespace/default
            type: string
          resourceName:
            description: "[Required] Friendly name of Cloud resource"
            example: Storage Resource
            type: string
          resourceType:
            description: "[Required] Type of Cloud resource"
            example: Microsoft.storage.table
            type: string
          initiatedBy:
            description: "[Optional] Email of POC"
            example: john.doe.ctr@mail.mil
            type: string
          cspAccountId:
            description: "[Optional] System/owner's CSP account ID/number"
            example: "123456789"
            type: string
          cspRegion:
            description: "[Optional] CSP region of system"
            example: useast2
            type: string
          isBaseline:
            description: "[Optional] True/false flag for providing results as baseline.\
              \ If true, all existing compliance results for the resourceId will be\
              \ replaced by results in the current call"
            example: true
            type: boolean
          tags:
            description: "[Optional] Informational tags associated to results for\
              \ other metadata"
            properties:
              test:
                example: testtag
                type: string
            type: object
          complianceResults:
            items:
              properties:
                cspPolicyDefinitionId:
                  description: "[Required] Unique identifier/compliance namespace\
                    \ for CSP/Resource's policy definition/compliance check"
                  example: /providers/sample/policy/namespace/au11_policy
                  type: string
                policyDefinitionTitle:
                  description: "[Required] Friendly policy/compliance check title.\
                    \ Recommend short title"
                  example: AU-11 - Audit Record Retention
                  type: string
                isCompliant:
                  description: "[Required] Compliance status of the policy for the\
                    \ identified cloud resource"
                  example: false
                  type: boolean
                complianceCheckTimestamp:
                  description: "[Optional] Unix date format"
                  example: 1644003780
                  format: int64
                  type: integer
                control:
                  description: "[Optional] Comma separated correlation to Security\
                    \ Control (e.g. exact NIST Control acronym)"
                  example: AU-11
                  type: string
                assessmentProcedure:
                  description: "[Optional] Comma separated correlation to Assessment\
                    \ Procedure (i.e. CCI number for DoD Control Set)"
                  example: "000167,000168"
                  type: string
                complianceReason:
                  description: "[Optional] Reason/comments for compliance result"
                  example: retention period not configured
                  type: string
                policyDeploymentName:
                  description: "[Optional] Name of policy deployment"
                  example: testDeployment
                  type: string
                policyDeploymentVersion:
                  description: "[Optional] Version of policy deployment"
                  example: 1.0.0
                  type: string
                severity:
                  description: "[Optional] Severity value"
                  enum:
                  - Low
                  - Medium
                  - High
                  - Critical
                  example: High
                  type: string
            required:
            - cspPolicyDefinitionId
            - isCompliant
            - policyDefinitionTitle
            type: array
      required:
      - provider
      - resourceId
      - resourceName
      - resourceType
      title: Cloude Resource POST Request Body
      type: array
    ContainerScanRequestPostBody:
      additionalProperties: false
      items:
        properties:
          containerId:
            description: "[Required] Unique identifier of the container"
            example: 157ac21c-49b4-4faf-a4ac-bfefd869ba3b
            type: string
          containerName:
            description: "[Required] Friendly name of the container"
            example: command-control
            type: string
          time:
            description: "[Required] Datetime of scan/result. Unix date format"
            example: 1648217219
            format: int64
            type: integer
          podName:
            description: "[Optional] Name of pod (e.g. Kubernetes pod)"
            example: command-control-955596ffc
            type: string
          podIp:
            description: "[Optional] IP address of pod"
            example: 1.1.1.101
            type: string
          namespace:
            description: "[Optional] Namespace of container in container orchestration\
              \ (e.g. Kubernetes namespace)"
            example: command-control
            type: string
          tags:
            description: "[Optional] Informational tags associated to results for\
              \ other metadata"
            properties:
              test:
                example: testtag
                type: string
            type: object
          benchmarks:
            items:
              properties:
                benchmark:
                  description: "[Required] Identifier of the benchmark/grouping of\
                    \ compliance results. (e.g. for STIG results, provide the benchmark\
                    \ id for the STIG technology)"
                  example: RHEL_8_STIG
                  type: string
                isBaseline:
                  description: "[Optional] True/false flag for providing results as\
                    \ baseline. If true, all existing compliance results for the provided\
                    \ benchmark within the container will be replaced by results in\
                    \ the current call"
                  example: false
                  type: boolean
                version:
                  description: "[Optional] The benchmark version."
                  example: 2
                  format: int64
                  nullable: true
                  type: integer
                  x-faker: random.number
                release:
                  description: "[Optional] The benchmark release."
                  example: 4
                  format: int64
                  nullable: true
                  type: integer
                  x-faker: random.number
                results:
                  items:
                    properties:
                      ruleId:
                        description: "[Required] Identifier for the compliance result,\
                          \ vulnerability, etc. the result is for"
                        example: SV-230221r743913_rule
                        type: string
                      status:
                        description: "[Required] Benchmark result status"
                        enum:
                        - Pass
                        - Fail
                        - Other
                        - Not Reviewed
                        - Not Checked
                        - Not Applicable
                        example: Pass
                        type: string
                      lastSeen:
                        description: "Date last seen, Unix date format"
                        example: 1648217219
                        format: int64
                        type: integer
                      message:
                        description: "[Optional] Comments for the result"
                        example: test message
                        type: string
                  required:
                  - lastSeen
                  - ruleId
                  - status
                  type: array
            required:
            - benchmark
            type: array
      required:
      - containerId
      - containerName
      - time
      title: Containers POST Request Body
      type: array
