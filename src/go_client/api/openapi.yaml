  /api/systems/{systemId}/device-scan-results:
    post:
      description: "\n**Request Body Required Field**\n- `scanType`\n\nScan Type Allow\
        \ Values:\n\n<ul>\n  <li>acasAsrArf (.zip)</li>\n  <li>acasNessus</li>\n \
        \ <li>disaStigViewerCklCklb (.ckl or .cklb)</li>\n  <li>disaStigViewerCmrs</li>\n\
        \  <li>policyAuditor (.zip)</li>       \n  <li>scapComplianceChecker</li>\n\
        </ul>\n\n\n<strong>Business Rules</strong><br>\n\nThe body of a request through\
        \ the Device Scan Results POST endpoint accepts a single binary file.\nSpecific\
        \ file extensions are expected depending upon the scanType parameter. For\
        \ example, .ckl or\n.cklb files are accepted when using scanType is set to\
        \ disaStigViewerCklCklb.\n\nWhen set to acasAsrArf or policyAuditor, a .zip\
        \ file is expected which should contain a single\nscan result (for example,\
        \ a single pair of .asr and .arf files). Single files are expected for\nall\
        \ other scan types as this endpoint requires files to be uploaded consecutively\
        \ as opposed to in bulk.\n\nCurrent scan types that are supported:\n<ul>\n\
        \  <li>ACAS: ASR/ARF</li>\n  <li>ACAS: NESSUS</li>\n  <li>DISA STIG Viewer:\
        \ CKL/CKLB</li>\n  <li>DISA STIG Viewer: CMRS</li>\n  <li>Policy Auditor</li>\
        \       \n  <li>SCAP Compliance Checker</li>\n</ul>"
      operationId: addScanResultsBySystemId
      parameters:
      - description: "**System Id**: The unique system record identifier."
        explode: false
        in: path
        name: systemId
        required: true
        schema:
          example: 35
          type: integer
          x-faker: random.number
        style: simple
      - description: "**Scan Type**: The file scan type to upload"
        explode: true
        in: query
        name: scanType
        required: true
        schema:
          default: disaStigViewerCklCklb
          enum:
          - acasAsrArf
          - acasNessus
          - disaStigViewerCklCklb
          - disaStigViewerCmrs
          - policyAuditor
          - scapComplianceChecker
          type: string
        style: form
      - description: |
          **Is Baseline**: Indicates that the imported file represents a baseline scan that includes
          all findings and results. Importing as a baseline scan, which assumes a common set of scan
          policies are used when conducting a scan, will replace a device's findings for a specific
          Benchmark. Applicable to ASR/ARF scans only.
        explode: true
        in: query
        name: isBaseline
        required: false
        schema:
          default: false
          type: boolean
          x-faker: random.boolean
        style: form
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/addScanResultsBySystemId_request"
        description: See `Business Rules` posted above for file type.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceScanResultsResponsePost"
          description: OK
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Created"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bad_Request"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthorized"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Not_Found"
          description: Not Found
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Method_Not_Allowed"
          description: Method Not Allowed
        "411":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Length_Required"
          description: Length Required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internal_Server_Error"
